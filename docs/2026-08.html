<style>
:root{--bg:#F7F6F1;--surface:#fff;--ink:#1E211C;--muted:#6B7065;--line:#E7E7DE;--accent:#1F7A5C;--warn:#B0464E}
@media(prefers-color-scheme:dark){:root{--bg:#171815;--surface:#212320;--ink:#E9EAE3;--muted:#A3A99C;--line:#31352D;--accent:#40AD84;--warn:#D2726B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 26px;box-shadow:0 8px 40px rgba(0,0,0,.08);text-align:center}
.lock .ic{font-size:34px;margin-bottom:10px}
.lock h1{font-size:19px;font-weight:700;margin:0 0 4px}
.lock p{font-size:13px;color:var(--muted);margin:0 0 22px;line-height:1.5}
.lock form{display:flex;flex-direction:column;gap:10px}
.lock input{font:inherit;font-size:16px;padding:13px 15px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;letter-spacing:.05em}
.lock input:focus{outline:none;border-color:var(--accent)}
.lock button{font:inherit;font-size:15px;font-weight:600;padding:13px;border-radius:11px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.lock button:active{opacity:.85}
.lock .err{color:var(--warn);font-size:12.5px;min-height:16px;margin-top:2px}
.lock .hint{font-size:11px;color:var(--muted);opacity:.7;margin-top:14px}
#content{display:none}
</style>

const b642buf = b64 => Uint8Array.from(atob(b64), c=>c.charCodeAt(0));

async function decrypt(password){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password),
    {name:"PBKDF2"}, false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b642buf(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:b642buf(ENC.iv)}, key, b642buf(ENC.ct));
  return new TextDecoder().decode(plain);
}

function render(html){
  // 복호화된 리포트를 페이지에 주입 (스크립트 포함 실행)
  document.getElementById("gate").style.display="none";
  const c = document.getElementById("content");
  c.style.display="block";
  c.innerHTML = html;
  c.querySelectorAll("script").forEach(old=>{
    const s=document.createElement("script");
    if(old.src) s.src=old.src; else s.textContent=old.textContent;
    document.body.appendChild(s); old.remove();
  });
  // 스타일 태그도 head로
  c.querySelectorAll("style").forEach(st=>document.head.appendChild(st));
}

async function tryOpen(password, silent){
  try{
    const html = await decrypt(password);
    try{ sessionStorage.setItem("rpw", password);}catch(e){}
    render(html);
    return true;
  }catch(e){
    if(!silent) document.getElementById("err").textContent="비밀번호가 올바르지 않습니다.";
    return false;
  }
}

document.getElementById("f").addEventListener("submit", async e=>{
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  document.getElementById("err").textContent="여는 중…";
  await tryOpen(pw, false);
});

// 같은 세션에서 이미 인증했으면 자동 복호화
(async()=>{ try{ const s=sessionStorage.getItem("rpw"); if(s) await tryOpen(s, true);}catch(e){} })();
